<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ShieldFlow</title>
</head>
<body>
<script>
const SERVER = window.location.origin;
let token = localStorage.getItem('sf_token') || '';

async function login() {
  const pwd = document.getElementById('pwd').value;
  const r = await fetch(SERVER + '/api/auth/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ password: pwd })
  });
  const d = await r.json();
  if (d.token) {
    token = d.token;
    localStorage.setItem('sf_token', token);
    location.reload();
  } else {
    document.getElementById('err').textContent = 'Mot de passe incorrect';
  }
}

if (!token) {
  document.write('<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0f1117;font-family:sans-serif"><div style="background:#1a1d27;padding:40px;border-radius:16px;width:320px;text-align:center"><div style="font-size:24px;font-weight:700;color:#4f7ef8;margin-bottom:20px">🛡 ShieldFlow</div><input id="pwd" type="password" placeholder="Mot de passe" style="width:100%;padding:12px;background:#222;border:1px solid #333;border-radius:8px;color:#fff;margin-bottom:12px;font-size:14px" onkeydown="if(event.key===\'Enter\')login()"><br><button onclick="login()" style="width:100%;padding:12px;background:#4f7ef8;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">Se connecter</button><div id="err" style="color:red;margin-top:10px"></div></div></div>');
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShieldFlow MSSP</title>
<style>
:root{--bg:#0a0d14;--surface:#111520;--surface2:#161b28;--surface3:#1c2235;--border:#1e2640;--text:#e8edf5;--text2:#8b9ab0;--text3:#4a5568;--blue:#2563eb;--blue2:#3b82f6;--green:#10b981;--red:#ef4444;--orange:#f97316;--amber:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;display:flex;overflow:hidden}
.sidebar{width:240px;min-width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh}
.logo{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.logo-text{font-size:16px;font-weight:700}.logo-sub{font-size:10px;color:var(--text3);margin-top:1px}
.nav{padding:12px 8px;flex:1;overflow-y:auto}
.nav-section{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:8px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s;margin-bottom:2px}
.nav-item:hover{background:var(--surface2);color:var(--text)}.nav-item.active{background:rgba(37,99,235,.15);color:var(--blue2)}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center}
.client-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--text2);transition:all .15s;margin-bottom:2px}
.client-item:hover,.client-item.active{background:var(--surface2);color:var(--text)}
.client-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.client-dot.offline{background:var(--text3)}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border)}
.avatar{width:32px;height:32px;background:var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{height:56px;min-height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.topbar-title{font-size:15px;font-weight:600}
.btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue2)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.content{flex:1;overflow-y:auto;padding:20px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.card.clickable{cursor:pointer;transition:all .15s}.card.clickable:hover{border-color:var(--blue);background:var(--surface2)}
.card-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.card-value{font-size:28px;font-weight:800;color:var(--text)}.card-sub{font-size:11px;color:var(--text3);margin-top:4px}
.section{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden}
.section-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.section-title{font-size:13px;font-weight:600}.section-body{padding:12px}
.alert-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;background:var(--surface2);margin-bottom:6px;border:1px solid var(--border)}
.alert-row:last-child{margin-bottom:0}
.sev{padding:3px 8px;border-radius:5px;font-size:10px;font-weight:700;flex-shrink:0}
.sev-critical{background:rgba(239,68,68,.15);color:var(--red)}.sev-high{background:rgba(249,115,22,.15);color:var(--orange)}
.sev-medium{background:rgba(245,158,11,.15);color:var(--amber)}.sev-low{background:rgba(16,185,129,.15);color:var(--green)}
.alert-info{flex:1;min-width:0}.alert-title{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert-device{font-size:11px;color:var(--text3);margin-top:2px}.alert-actions{display:flex;gap:6px;flex-shrink:0}
.action-btn{padding:4px 10px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;border:none;transition:all .15s}
.action-fix{background:var(--green);color:#fff}.action-fix:hover{opacity:.85}
.action-info{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.2)}.action-info:hover{background:rgba(249,115,22,.25)}
.empty-state{text-align:center;padding:30px;color:var(--text3)}.empty-icon{font-size:32px;margin-bottom:8px}
.cloud-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;background:var(--surface2);margin-bottom:6px;border:1px solid var(--border)}
.device-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--surface2);margin-bottom:6px;border:1px solid var(--border)}
.install-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:monospace;font-size:11px;color:var(--green);word-break:break-all;position:relative}
.copy-btn{position:absolute;top:8px;right:8px;background:var(--blue);border:none;color:#fff;padding:4px 10px;border-radius:5px;font-size:10px;cursor:pointer;font-weight:600}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:90%;max-width:520px;max-height:85vh;display:flex;flex-direction:column}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:600}.modal-close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer}
.modal-body{padding:20px;overflow-y:auto;flex:1}.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.form-group{margin-bottom:14px}.form-label{font-size:11px;color:var(--text2);margin-bottom:6px;display:block}
.form-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-size:13px;outline:none}
.form-input:focus{border-color:var(--blue)}
.form-select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-size:13px;outline:none}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;width:360px}
.overview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.stat-value{font-size:36px;font-weight:800}.stat-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.rgpd-article{padding:10px 0;border-bottom:1px solid var(--border)}.rgpd-article:last-child{border-bottom:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.online-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
</style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div style="text-align:center;margin-bottom:30px">
      <div style="font-size:40px">🛡</div>
      <h1 style="font-size:22px;font-weight:800;margin-top:8px">ShieldFlow</h1>
      <p style="color:var(--text3);font-size:12px;margin-top:4px">Plateforme MSSP de cybersécurité</p>
    </div>
    <div id="login-error" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:var(--red);padding:10px 12px;border-radius:8px;font-size:12px;margin-bottom:14px;display:none">Mot de passe incorrect</div>
    <div class="form-group">
      <label class="form-label">Mot de passe MSSP</label>
      <input class="form-input" type="password" id="login-pw" placeholder="••••••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-primary" style="width:100%;padding:10px" onclick="doLogin()">Se connecter</button>
  </div>
</div>

<div id="app" style="display:none;width:100%;height:100%;flex-direction:row">
<div class="sidebar">
  <div class="logo">
    <div class="logo-icon">🛡</div>
    <div><div class="logo-text">ShieldFlow</div><div class="logo-sub">MSSP Platform</div></div>
  </div>
  <div class="nav">
    <div class="nav-section">Navigation</div>
    <div class="nav-item active" id="nav-overview" onclick="showView('overview')">
      <span>🏠</span> Vue d'ensemble
      <span class="badge" id="badge-total" style="display:none">0</span>
    </div>
    <div class="nav-section" style="margin-top:8px">Clients</div>
    <div id="clients-nav"></div>
    <div class="nav-item" onclick="openAddClient()" style="margin-top:8px;border:1px dashed var(--border)">
      <span>+</span> Ajouter un client
    </div>
  </div>
  <div class="sidebar-footer">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="avatar">M</div>
      <div><div style="font-size:12px;font-weight:600">Administrateur</div><div style="font-size:10px;color:var(--text3)">MSSP</div></div>
    </div>
  </div>
</div>
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">Vue d'ensemble</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" onclick="refreshAll()" id="refresh-btn">↻ Actualiser</button>
      <button class="btn" style="background:rgba(124,58,237,.15);color:#a78bfa;border:1px solid rgba(124,58,237,.2)" id="soc-btn" onclick="if(state.sel)showSOCReport(state.sel.id)" >🔍 Rapport SOC</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const S='https://shieldflow-rfzv.onrender.com';
let state={tenants:[],selectedTenant:null,view:'overview'};

function doLogin(){
  const pw=document.getElementById('login-pw').value.trim();
  console.log('Login attempt:', pw.length, 'chars');
  if(pw==='Tarahanafi13.'){
    document.getElementById('login-screen').style.display='none';
    const app=document.getElementById('app');
    app.style.display='flex';
    init();
  } else {
    document.getElementById('login-error').style.display='block';
    console.log('Wrong password');
  }
}

async function init(){
  await loadTenants();
  showView('overview');
  setInterval(loadTenants,30000);
}

async function loadTenants(){
  try{
    const r=await fetch(S+'/api/mssp/tenants');
    const d=await r.json();
    state.tenants=d.tenants||[];
    renderSidebarClients();
    updateBadge();
    if(state.view==='overview')renderOverview();
    if(state.view==='client'&&state.selectedTenant){
      const up=state.tenants.find(t=>t.id===state.selectedTenant.id);
      if(up)state.selectedTenant=up;
    }
  }catch(e){console.error(e);}
}

function updateBadge(){
  const total=state.tenants.reduce((s,t)=>s+(t.alert_count||0),0);
  const el=document.getElementById('badge-total');
  if(total>0){el.textContent=total;el.style.display='inline';}else el.style.display='none';
}

function renderSidebarClients(){
  document.getElementById('clients-nav').innerHTML=state.tenants.map(t=>`
    <div class="client-item ${state.selectedTenant?.id===t.id?'active':''}" onclick="selectClient('${t.id}')">
      <div class="client-dot ${t.status==='online'?'':'offline'}"></div>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.name}</span>
      ${t.alert_count>0?`<span style="background:var(--red);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px">${t.alert_count}</span>`:''}
    </div>`).join('');
}

function selectClient(id){
  state.selectedTenant=state.tenants.find(t=>t.id===id);
  if(state.selectedTenant){showView('client');renderSidebarClients();}
}

function showView(view){
  state.view=view;
  document.getElementById('nav-overview').classList.toggle('active',view==='overview');
  if(view==='overview'){document.getElementById('topbar-title').textContent="Vue d'ensemble";renderOverview();}
  else if(view==='client'){document.getElementById('topbar-title').textContent=state.selectedTenant?.name||'Client';renderClient();}
}

async function refreshAll(){
  const btn=document.getElementById('refresh-btn');
  btn.textContent='↻ Chargement...';btn.disabled=true;
  await loadTenants();
  if(state.view==='client'&&state.selectedTenant)await renderClient();
  btn.textContent='↻ Actualiser';btn.disabled=false;
  showToast('Données actualisées');
}

function renderOverview(){
  const total=state.tenants.length;
  const alerts=state.tenants.reduce((s,t)=>s+(t.alert_count||0),0);
  const crits=state.tenants.reduce((s,t)=>s+(t.critical_count||0),0);
  const avg=total>0?Math.round(state.tenants.reduce((s,t)=>s+(t.score||100),0)/total):100;
  const sc=avg>=80?'var(--green)':avg>=50?'var(--orange)':'var(--red)';
  document.getElementById('content').innerHTML=`
    <div class="overview-grid" style="margin-bottom:20px">
      <div class="stat-card"><div class="stat-value" style="color:var(--blue2)">${total}</div><div class="stat-label">Clients actifs</div></div>
      <div class="stat-card"><div class="stat-value" style="color:${alerts>0?'var(--orange)':'var(--green)'}">${alerts}</div><div class="stat-label">Alertes totales</div></div>
      <div class="stat-card"><div class="stat-value" style="color:${crits>0?'var(--red)':'var(--green)'}">${crits}</div><div class="stat-label">Critiques</div></div>
      <div class="stat-card"><div class="stat-value" style="color:${sc}">${avg}/100</div><div class="stat-label">Score moyen</div></div>
    </div>
    <div class="section">
      <div class="section-header"><div class="section-title">📋 Tous les clients</div></div>
      <div class="section-body">
        ${state.tenants.length===0?'<div class="empty-state"><div class="empty-icon">🏢</div>Aucun client</div>':
          state.tenants.map(t=>{
            const sc=(t.score||100)>=80?'var(--green)':(t.score||100)>=50?'var(--orange)':'var(--red)';
            return `<div class="alert-row" style="cursor:pointer" onclick="selectClient('${t.id}')">
              <div style="font-size:20px">🏢</div>
              <div class="alert-info"><div class="alert-title">${t.name}</div><div class="alert-device">${t.device_count||0} appareil(s) · ${t.alert_count||0} alerte(s)</div></div>
              <div style="font-size:18px;font-weight:800;color:${sc}">${t.score||100}</div>
              <span style="color:var(--text3);font-size:16px">›</span>
            </div>`;
          }).join('')}
      </div>
    </div>`;
}

async function renderClient(){
  const t=state.selectedTenant;
  if(!t)return;
  document.getElementById('content').innerHTML='<div style="text-align:center;padding:40px;color:var(--text3)">Chargement...</div>';
  try{
    const [dashR,cloudR,rgpdR]=await Promise.all([
      fetch(S+'/api/mssp/tenants/'+t.id+'/dashboard'),
      fetch(S+'/api/mssp/tenants/'+t.id+'/cloud'),
      fetch(S+'/api/mssp/tenants/'+t.id+'/rgpd'),
    ]);
    const dash=await dashR.json();
    const cloud=await cloudR.json();
    const rgpd=await rgpdR.json();
    const alerts=dash.alerts||[];
    const devices=dash.devices||[];
    const clouds=cloud.clouds||[];
    const score=dash.score||100;
    const sc=score>=80?'var(--green)':score>=50?'var(--orange)':'var(--red)';
    const crits=alerts.filter(a=>a.severity==='critical').length;
    const rc=rgpd.conforme?'var(--green)':rgpd.score>=60?'var(--orange)':'var(--red)';

    document.getElementById('content').innerHTML=`
      <div class="cards-grid" style="margin-bottom:16px">
        <div class="card"><div class="card-label">Score sécurité</div><div class="card-value" style="color:${sc}">${score}/100</div><div class="card-sub">${score>=80?'Bon niveau':'À améliorer'}</div></div>
        <div class="card clickable" onclick="showRGPD('${t.id}')"><div class="card-label">Conformité RGPD 📋</div><div class="card-value" style="color:${rc};font-size:22px">${rgpd.score||'--'}/100</div><div class="card-sub" style="color:${rc}">${rgpd.level||'Non évalué'}</div></div>
        <div class="card"><div class="card-label">Appareils</div><div class="card-value" style="color:var(--blue2)">${devices.length}</div><div class="card-sub">en surveillance</div></div>
        <div class="card"><div class="card-label">Alertes</div><div class="card-value" style="color:${alerts.length>0?'var(--orange)':'var(--green)'}">${alerts.length}</div><div class="card-sub">${crits} critique(s)</div></div>
      </div>

      <div class="section" style="margin-bottom:16px">
        <div class="section-header"><div class="section-title">🔑 Commande installation agent</div></div>
        <div class="section-body">
          <div style="font-size:11px;color:var(--text3);margin-bottom:8px">Lancez sur chaque machine du client :</div>
          <div class="install-box">curl -sSL ${S}/install.sh | bash -s -- ${t.id} ${t.agent_key||''}
            <button class="copy-btn" onclick="copyCmd('${t.id}','${t.agent_key||''}')">📋 Copier</button>
          </div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="section">
          <div class="section-header"><div class="section-title">🔔 Alertes (${alerts.length})</div></div>
          <div class="section-body">
            ${alerts.length===0?'<div class="empty-state"><div class="empty-icon">✅</div>Aucune alerte</div>':
              alerts.map(a=>`
                <div class="alert-row">
                  <span class="sev sev-${a.severity}">${a.severity.toUpperCase()}</span>
                  <div class="alert-info"><div class="alert-title">${a.title}</div><div class="alert-device">${a.device_name||''}</div></div>
                  <div class="alert-actions">
                    ${a.auto_fixable!==false
                      ?`<button class="action-btn action-fix" onclick="fixAlert('${t.id}','${a._id}')">⚡ Régler</button>`
                      :`<button class="action-btn action-info" onclick="showInstructions('${t.id}','${a._id}')">📋 Instructions</button>`}
                    <button class="action-btn" style="background:rgba(124,58,237,.15);color:#a78bfa;border:1px solid rgba(124,58,237,.2);margin-left:4px" onclick="showAIAnalysis('${t.id}','${a._id}')">🤖 IA</button>
                  </div>
                </div>`).join('')}
          </div>
        </div>
        <div>
          <div class="section" style="margin-bottom:16px">
            <div class="section-header"><div class="section-title">☁️ Cloud (${clouds.length})</div><button class="btn btn-ghost" style="font-size:11px;padding:5px 10px" onclick="openAddCloud('${t.id}')">+ Connecter</button></div>
            <div class="section-body">
              ${clouds.length===0?'<div class="empty-state" style="padding:16px"><div style="font-size:20px;margin-bottom:4px">☁️</div>Aucun cloud connecté</div>':
                clouds.map(c=>{
                  const icons={aws:'🟠 AWS',m365:'🔵 M365',gworkspace:'🟡 Google'};
                  const ls=c.last_scan?new Date(c.last_scan).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'En attente';
                  return `<div class="cloud-item">
                    <div style="font-size:18px">${icons[c.type]||c.type}</div>
                    <div style="flex:1"><div style="font-size:12px;font-weight:600">${c.type.toUpperCase()}</div><div style="font-size:11px;color:var(--green)">● Connecté · ${ls}</div></div>
                    <div style="display:flex;gap:6px">
                      <button class="action-btn action-fix" onclick="scanCloud('${t.id}','${c.type}')">🔍</button>
                      <button class="action-btn action-info" onclick="deleteCloud('${t.id}','${c.type}')">🗑</button>
                    </div>
                  </div>`;
                }).join('')}
            </div>
          </div>
          <div class="section">
            <div class="section-header"><div class="section-title">💻 Appareils (${devices.length})</div></div>
            <div class="section-body">
              ${devices.length===0?'<div class="empty-state" style="padding:16px"><div style="font-size:20px">💻</div>Aucun appareil</div>':
                devices.map(d=>`
                  <div class="device-row">

async function scanCloud(tid,type){
  showToast('Scan '+type+' en cours...');

async function deleteCloud(tid,type){
  if(!confirm('Supprimer la connexion '+type+' ?'))return;
  try{
    const r=await fetch(S+'/api/mssp/tenants/'+tid+'/cloud/'+type,{method:'DELETE'});
    const d=await r.json();
    if(d.success){showToast('Cloud supprimé');await loadTenants();renderClient();}
    else showToast('Erreur: '+(d.error||'Inconnue'));
  }catch(e){showToast('Erreur');}
}

function openAddClient(){
  openModal('Ajouter un client');
  document.getElementById('modal-body').innerHTML=`
    <div class="form-group"><label class="form-label">Nom du client</label><input class="form-input" id="nc-name" placeholder="Ex: Entreprise Martin" autofocus></div>
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="nc-email" placeholder="contact@entreprise.fr"></div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="createClient()">Créer</button></div>`;
}

async function createClient(){
  const name=document.getElementById('nc-name').value.trim();
  const email=document.getElementById('nc-email').value.trim();
  if(!name){showToast('Nom requis');return;}
  try{
    const r=await fetch(S+'/api/mssp/tenants',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password:'client123'})});
    const d=await r.json();
    if(d.success||d.tenant){showToast('Client créé !');closeModal();await loadTenants();if(d.tenant?.id)selectClient(d.tenant.id);}
    else showToast('Erreur: '+(d.error||'Inconnue'));
  }catch(e){showToast('Erreur');}
}

function openAddCloud(tid){
  openModal('Connecter un cloud');
  document.getElementById('modal-body').innerHTML=`
    <div class="form-group"><label class="form-label">Type</label>
    <select class="form-select" id="cloud-type" onchange="renderCloudFields()">
      <option value="">Choisir...</option>
      <option value="m365">🔵 Microsoft 365</option>
      <option value="aws">🟠 Amazon AWS</option>
      <option value="gworkspace">🟡 Google Workspace</option>
    </select></div>
    <div id="cloud-fields"></div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="connectCloud('${tid}')">Connecter</button></div>`;
}

function renderCloudFields(){
  const type=document.getElementById('cloud-type').value;
  const el=document.getElementById('cloud-fields');
  if(type==='m365')el.innerHTML=`
    <div class="form-group"><label class="form-label">Tenant ID</label><input class="form-input" id="cf1" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></div>
    <div class="form-group"><label class="form-label">Client ID</label><input class="form-input" id="cf2" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></div>
    <div class="form-group"><label class="form-label">Client Secret</label><input class="form-input" id="cf3" type="password" placeholder="votre-secret"></div>`;
  else if(type==='aws')el.innerHTML=`
    <div class="form-group"><label class="form-label">Access Key ID</label><input class="form-input" id="cf1" placeholder="AKIAIOSFODNN7EXAMPLE"></div>
    <div class="form-group"><label class="form-label">Secret Access Key</label><input class="form-input" id="cf2" type="password" placeholder="votre-secret"></div>
    <div class="form-group"><label class="form-label">Région</label><input class="form-input" id="cf3" value="eu-west-3"></div>`;
  else if(type==='gworkspace')el.innerHTML=`
    <div class="form-group"><label class="form-label">Email admin</label><input class="form-input" id="cf1" placeholder="admin@domaine.com"></div>
    <div class="form-group"><label class="form-label">Credentials JSON</label><textarea class="form-input" id="cf2" rows="4" placeholder='{"type":"service_account",...}'></textarea></div>`;
  else el.innerHTML='';
}

async function connectCloud(tid){
  const type=document.getElementById('cloud-type').value;
  if(!type){showToast('Choisissez un type');return;}
  let creds={};
  if(type==='m365')creds={tenant_id:document.getElementById('cf1')?.value,client_id:document.getElementById('cf2')?.value,client_secret:document.getElementById('cf3')?.value};
  else if(type==='aws')creds={access_key:document.getElementById('cf1')?.value,secret_key:document.getElementById('cf2')?.value,region:document.getElementById('cf3')?.value||'eu-west-3'};
  else if(type==='gworkspace')creds={admin_email:document.getElementById('cf1')?.value,service_account_json:document.getElementById('cf2')?.value};
  try{
    const r=await fetch(S+'/api/mssp/tenants/'+tid+'/cloud',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cloud_type:type,credentials:creds})});
    const d=await r.json();
    if(d.success){showToast('Cloud connecté !');closeModal();await loadTenants();renderClient();}
    else showToast('Erreur: '+(d.error||'Inconnue'));
  }catch(e){showToast('Erreur');}
}

function openModal(title){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML='';document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

let toastTimer;
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000);}
</script>

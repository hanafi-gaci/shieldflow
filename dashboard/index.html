<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShieldFlow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0f1117;color:#e2e4f0;height:100vh}
.login{display:flex;align-items:center;justify-content:center;height:100vh}
.box{background:#1a1d27;border:1px solid #2e3148;border-radius:16px;padding:40px;width:340px;text-align:center}
.logo{font-size:22px;font-weight:700;color:#4f7ef8;margin-bottom:24px}
input{width:100%;padding:12px;background:#222534;border:1px solid #2e3148;border-radius:8px;color:#e2e4f0;font-size:14px;margin-bottom:12px}
button{width:100%;padding:12px;background:#4f7ef8;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600}
.err{color:#ef4444;font-size:13px;margin-top:8px}
.app{display:none;flex-direction:column;height:100vh}
.topbar{background:#1a1d27;border-bottom:1px solid #2e3148;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:18px;font-weight:700;color:#4f7ef8}
.topbar-right{display:flex;gap:12px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
.btn{padding:8px 16px;background:#222534;border:1px solid #2e3148;border-radius:8px;color:#e2e4f0;cursor:pointer;font-size:13px}
.content{flex:1;padding:24px;overflow-y:auto}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.card{background:#1a1d27;border:1px solid #2e3148;border-radius:12px;padding:20px}
.card-label{font-size:12px;color:#7c8099;margin-bottom:8px}
.card-value{font-size:28px;font-weight:700}
.green{color:#22c55e}.orange{color:#f97316}.red{color:#ef4444}.blue{color:#4f7ef8}
.section{background:#1a1d27;border:1px solid #2e3148;border-radius:12px;overflow:hidden;margin-bottom:16px}
.section-header{padding:14px 20px;border-bottom:1px solid #2e3148;font-size:14px;font-weight:600}
.alert-item{padding:14px 20px;border-bottom:1px solid #2e3148;display:flex;gap:12px;align-items:flex-start}
.alert-item:last-child{border-bottom:none}
.sev{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;flex-shrink:0}
.CRITICAL{background:#ef444422;color:#ef4444;border:1px solid #ef444444}
.HIGH{background:#f9731622;color:#f97316;border:1px solid #f9731644}
.MEDIUM{background:#eab30822;color:#eab308;border:1px solid #eab30844}
.alert-title{font-size:13px;font-weight:500;margin-bottom:3px}
.alert-desc{font-size:12px;color:#7c8099}
.empty{padding:40px;text-align:center;color:#7c8099}
</style>
</head>
<body>
<div class="login" id="login">
  <div class="box">
    <div class="logo">🛡 ShieldFlow</div>
    <input type="password" id="pwd" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Se connecter →</button>
    <div class="err" id="err"></div>
  </div>
</div>
<div class="app" id="app">
  <div class="topbar">
    <h1>🛡 ShieldFlow</h1>
    <div class="topbar-right">
      <div class="dot"></div>
      <span style="font-size:13px;color:#22c55e">En ligne</span>
      <button class="btn" onclick="load()">↻ Actualiser</button>
      <button class="btn" onclick="logout()">Quitter</button>
    </div>
  </div>
  <div class="content">
    <div class="cards">
      <div class="card"><div class="card-label">Score moyen</div><div class="card-value" id="score" style="color:#22c55e">—</div></div>
      <div class="card"><div class="card-label">Appareils</div><div class="card-value blue" id="devices">0</div></div>
      <div class="card"><div class="card-label">Alertes</div><div class="card-value orange" id="alerts">0</div></div>
      <div class="card"><div class="card-label">Critiques</div><div class="card-value red" id="criticals">0</div></div>
    </div>
    <div class="section">
      <div class="section-header">Alertes de sécurité</div>
      <div id="alerts-list"><div class="empty">Chargement...</div></div>
    </div>
  </div>
</div>
<script>
const S = window.location.origin;
let tok = localStorage.getItem('sf_tok') || '';

async function login() {
  const pwd = document.getElementById('pwd').value;
  try {
    const r = await fetch(S+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})});
    const d = await r.json();
    if(d.token){tok=d.token;localStorage.setItem('sf_tok',tok);showApp();}
    else document.getElementById('err').textContent='Mot de passe incorrect';
  } catch(e){document.getElementById('err').textContent='Erreur de connexion';}
}

function logout(){localStorage.removeItem('sf_tok');tok='';location.reload();}

function showApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  load();
  setInterval(load,30000);
}

async function load(){
  try{
    const r = await fetch(S+'/api/dashboard/overview');
    if(!r.ok) return;
    const d = await r.json();
    const sc = d.average_score||0;
    document.getElementById('score').textContent = sc+'/100';
    document.getElementById('score').style.color = sc>=80?'#22c55e':sc>=50?'#f97316':'#ef4444';
    document.getElementById('devices').textContent = d.device_count||0;
    document.getElementById('alerts').textContent = d.total_alerts||0;
    document.getElementById('criticals').textContent = d.critical_alerts||0;
    const threats = d.top_threats||[];
    const el = document.getElementById('alerts-list');
    if(!threats.length){el.innerHTML='<div class="empty">✅ Aucune alerte</div>';return;}
    el.innerHTML = threats.map(a=>`
      <div class="alert-item">
        <span class="sev ${a.severity}">${a.severity}</span>
        <div>
          <div class="alert-title">${a.title}</div>
          <div class="alert-desc">${a.description}</div>
        </div>
      </div>`).join('');
  }catch(e){console.error(e);}
}

if(tok){showApp();}
</script>
</body>
</html>
